name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (auto, patch, minor, major)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (don't push tag or publish)"
        required: false
        type: boolean
        default: false

permissions: write-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.7"

jobs:
  # ─── Phase 1: Auto-version ────────────────────────────────────────────────────
  # Runs on workflow_run (CI passed on main) or workflow_dispatch.
  # Determines semver bump from conventional commits, updates package.json,
  # commits [skip ci], and pushes a tag — Phase 2 chains directly from here.

  determine-release:
    name: Determine Release Version
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should-release: ${{ steps.release-check.outputs.should-release }}
      release-type: ${{ steps.release-check.outputs.release-type }}
      new-version: ${{ steps.release-check.outputs.new-version }}
      current-version: ${{ steps.release-check.outputs.current-version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release
        id: release-check
        run: |
          CURRENT_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "current-version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

          # Skip if HEAD is already a release commit
          HEAD_MSG=$(git log -1 --pretty=format:"%s")
          echo "HEAD commit: $HEAD_MSG"
          if echo "$HEAD_MSG" | grep -qE "\[skip ci\]|^chore\(release\):"; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "HEAD is already a release commit, skipping"
            exit 0
          fi

          # Find last version tag
          LAST_TAG=$(git tag --sort=-version:refname | grep -E "^v[0-9]" | head -1)
          echo "Last tag: '$LAST_TAG'"

          if [ -z "$LAST_TAG" ]; then
            COMMITS_SINCE_LAST=$(git rev-list --count HEAD)
          else
            COMMITS_SINCE_LAST=$(git rev-list --count "${LAST_TAG}..HEAD")
          fi
          echo "Commits since last release: $COMMITS_SINCE_LAST"

          if [ "$COMMITS_SINCE_LAST" -eq 0 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "should-release=false" >> $GITHUB_OUTPUT
            echo "No new commits since last release"
            exit 0
          fi

          # Determine release type from conventional commits or dispatch input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_type }}" != "auto" ]; then
            RELEASE_TYPE="${{ inputs.release_type }}"
          else
            if [ -z "$LAST_TAG" ]; then
              COMMITS_TO_CHECK=$(git log --pretty=format:"%s" HEAD)
            else
              COMMITS_TO_CHECK=$(git log --pretty=format:"%s" "${LAST_TAG}..HEAD")
            fi
            echo "Commits to analyze:"
            echo "$COMMITS_TO_CHECK"

            if echo "$COMMITS_TO_CHECK" | grep -qE "^[a-zA-Z]+(\(.+\))?!:" || echo "$COMMITS_TO_CHECK" | grep -qE "BREAKING CHANGE"; then
              RELEASE_TYPE="major"
            elif echo "$COMMITS_TO_CHECK" | grep -qE "^feat(\(.+\))?:"; then
              RELEASE_TYPE="minor"
            else
              RELEASE_TYPE="patch"
            fi
          fi
          echo "Release type: $RELEASE_TYPE"

          # Calculate new version (strip any prerelease suffix before bumping)
          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-.*//')
          IFS='.' read -ra PARTS <<< "$BASE_VERSION"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          case $RELEASE_TYPE in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "should-release=true" >> $GITHUB_OUTPUT
          echo "release-type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Determined: $RELEASE_TYPE ($CURRENT_VERSION → $NEW_VERSION)"

  bump-and-tag:
    name: Bump Version & Push Tag
    runs-on: ubuntu-latest
    needs: determine-release
    if: needs.determine-release.outputs.should-release == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          RELEASE_TYPE="${{ needs.determine-release.outputs.release-type }}"
          NEW_VERSION="${{ needs.determine-release.outputs.new-version }}"
          echo "Bumping version ($RELEASE_TYPE) → $NEW_VERSION"
          bun run --cwd packages/cli script/version.ts "$NEW_VERSION"

      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        run: |
          NEW_VERSION="${{ needs.determine-release.outputs.new-version }}"
          git add packages/cli/package.json
          git commit -m "chore(release): v${NEW_VERSION} [skip ci]"
          git tag -fa "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push --force origin main "v${NEW_VERSION}"
          echo "Pushed v${NEW_VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "=== DRY RUN ==="
          echo "Would release: ${{ needs.determine-release.outputs.release-type }} → v${{ needs.determine-release.outputs.new-version }}"
          echo "No changes pushed."

  # ─── Phase 2: Build & Publish ─────────────────────────────────────────────────
  # Runs in the same workflow run after bump-and-tag pushes the version tag.

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [determine-release, bump-and-tag]
    if: needs.determine-release.outputs.should-release == 'true' && inputs.dry_run != true
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.determine-release.outputs.new-version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          VERSION="${{ needs.determine-release.outputs.new-version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        working-directory: packages/cli
        run: bun run script/version.ts ${{ steps.version.outputs.version }}

      - name: Build all platforms
        working-directory: packages/cli
        run: bun run script/publish.ts

      - name: Move artifacts to staging
        working-directory: packages/cli
        run: |
          mkdir -p staging/archives staging/npm
          mv dist/*.tar.gz dist/*.zip staging/archives/ 2>/dev/null || true
          mv dist/*/*.tgz staging/npm/ 2>/dev/null || true

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: packages/cli/staging/archives/
          retention-days: 7

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: packages/cli/staging/npm/
          retention-days: 7

  smoke-test:
    name: Smoke Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ralph-linux-x64.tar.gz
          - os: macos-latest
            artifact: ralph-darwin-arm64.zip
          - os: windows-latest
            artifact: ralph-windows-x64.zip
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives

      - name: Extract and test (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -xzf archives/${{ matrix.artifact }}
          chmod +x ralph
          ./ralph --version

      - name: Extract and test (macOS)
        if: runner.os == 'macOS'
        run: |
          unzip archives/${{ matrix.artifact }}
          chmod +x ralph
          ./ralph --version

      - name: Extract and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path archives/${{ matrix.artifact }} -DestinationPath .
          ./ralph.exe --version

  publish-npm:
    name: Publish to npm
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-packages

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Determine npm tag
        id: npm_tag
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "tag=preview" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish packages
        run: |
          TAG="${{ steps.npm_tag.outputs.tag }}"
          echo "Publishing with tag: $TAG"
          for pkg in npm-packages/*.tgz; do
            if [ -f "$pkg" ]; then
              echo "Publishing $pkg..."
              npm publish "$pkg" --access public --tag "$TAG" --provenance
            fi
          done

  publish-docker:
    name: Publish Docker Image
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives

      - name: Prepare binaries for Docker
        run: |
          mkdir -p packages/cli/dist/ralph-linux-x64/bin
          mkdir -p packages/cli/dist/ralph-linux-arm64/bin
          tar -xzf archives/ralph-linux-x64.tar.gz -C packages/cli/dist/ralph-linux-x64/bin
          tar -xzf archives/ralph-linux-arm64.tar.gz -C packages/cli/dist/ralph-linux-arm64/bin
          chmod +x packages/cli/dist/ralph-linux-*/bin/ralph

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ needs.build.outputs.is_prerelease == 'false' }}
            type=raw,value=preview,enable=${{ needs.build.outputs.is_prerelease == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-npm:
    name: Verify npm (${{ matrix.name }})
    needs: [publish-npm]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-glibc
            platform: linux/amd64
            image: node:20
          - name: linux-x64-musl
            platform: linux/amd64
            image: node:20-alpine
          - name: linux-arm64-glibc
            platform: linux/arm64
            image: node:20
          - name: linux-arm64-musl
            platform: linux/arm64
            image: node:20-alpine
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Verify npm install
        run: |
          docker run --rm --platform ${{ matrix.platform }} ${{ matrix.image }} \
            sh -c 'npm install -g @wiggumdev/ralph && ralph --version'

  create-release:
    name: Create GitHub Release
    needs: [build, smoke-test, publish-npm, verify-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: archives

      - name: Create GitHub release
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          PRERELEASE_FLAG=""
          if [ "${{ needs.build.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            archives/*.tar.gz \
            archives/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
